[package]
name = "download_craft"
version = "0.9.7"
edition = "2021"
description = "Download Craft — a lightweight, offline-first download manager (egui GUI + CLI)"
license = "MIT"

[dependencies]
eframe = "0.32"
egui = "0.32"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json", "multipart"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "5"
url = "2"
anyhow = "1"
ab_glyph = "0.2"
arboard = "3"
clap = { version = "4", features = ["derive"] }
notify-rust = "4"
rfd = "0.15"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
rustybuzz = "0.20.1"
unicode-segmentation = "1.13.3"
flate2 = "1"
# Archive extraction (ZIP / RAR / 7z). Only the decoders are pulled in:
# `zip` reuses the flate2 backend this project already depends on, and
# sevenz-rust's default "compress" feature (the encoder) is switched off.
zip = { version = "9", default-features = false, features = ["deflate-flate2", "aes-crypto"] }
# sevenz-rust's "aes256" feature needs the LZMA encoder that ships in its
# default features, so the defaults stay on.
sevenz-rust = { version = "0.6", features = ["aes256"] }
unrar = "0.5"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.20"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }

[target.'cfg(unix)'.dependencies]
shlex = "2"
